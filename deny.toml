# deny.toml — cargo-deny configuration for vulnerability and license scanning

# Advisory scanning: fail on any new advisory in the dependency tree
advisories = "warn"

# License scanning: fail on GPL-incompatible licenses, warn on others
licenses = "warn"

# Explicitly allow list — any licenses not matched here that are restricted
# will cause cargo-deny to fail. We allow common permissive licenses.
allow {
  # Permissive licenses
  MIT
  Apache-2.0
  BSD-2-Clause
  BSD-3-Clause
  BSD-4-Clause
  Unlicense

  # Stellar/Soroban ecosystem
  ISC
}

# Deny list — licenses that are never allowed
deny {
  # Copyleft licenses that are incompatible with proprietary use
  GPL-2.0
  GPL-2.0+
  GPL-3.0
  GPL-3.0+
  AGPL-3.0
  AGPL-3.0+
  LGPL-2.1
  LGPL-2.1+
  LGPL-3.0
  LGPL-3.0+
}

# Specific advisory exceptions — these are known-good advisories that
# would otherwise cause cargo-deny to fail. Each needs a reason.
# Example:
# exceptions {
#   "RUSTSEC-2024-0001" = "transitive dependency, not directly used"
# }

# Ignore advisories from specific sources if needed
# ignore {
#   "github.com/rustsec/rustsec: advisory-type" = "reason"
# }